name: Build ARMv7 APK

on:
  push:
    branches:
      - armv7-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-32" "build-tools;32.0.0" "ndk;25.2.9519653"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK architecture
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/.*\.so$'
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo 'Unexpected ARM64 libraries found in ARMv7 APK'
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wgserve-armv7-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
