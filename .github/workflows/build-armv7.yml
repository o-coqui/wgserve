name: Build release APKs

on:
  push:
    tags:
      - 'v1.2.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-32" "build-tools;32.0.0" "ndk;25.2.9519653"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android
      - name: Prepare patched wgslirpy
        run: |
          set -e
          git clone https://github.com/vi/wgslirpy.git wgslirpy
          git -C wgslirpy checkout 6805933f3e6f88f3cd8d1106a135d7d53eb198ea
          python3 scripts/patch-wgslirpy-portmap.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("wgserv/Cargo.toml")
          s = p.read_text()
          old = 'libwgslirpy = "0.2.0"'
          new = 'libwgslirpy = { path = "../wgslirpy/crates/libwgslirpy" }'
          if old not in s: raise SystemExit("libwgslirpy dependency line not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
        run: |
          chmod +x ./gradlew
          ./gradlew cargoBuild assembleRelease --stacktrace
      - name: Sign APKs
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > wgserve-release.jks
          for APK in app/build/outputs/apk/release/*.apk; do
            NAME=$(basename "$APK")
            case "$NAME" in
              *armeabi-v7a*) OUT="wgserve-armv7.apk" ;;
              *arm64-v8a*) OUT="wgserve-arm64.apk" ;;
              *universal*) OUT="wgserve-universal.apk" ;;
              *) continue ;;
            esac
            "$ANDROID_HOME/build-tools/32.0.0/apksigner" sign --ks wgserve-release.jks --ks-key-alias wgserve --ks-pass pass:"$STORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out "app/build/outputs/apk/release/$OUT" "$APK"
            "$ANDROID_HOME/build-tools/32.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/$OUT"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wgserve-release-apks
          path: |
            app/build/outputs/apk/release/wgserve-armv7.apk
            app/build/outputs/apk/release/wgserve-arm64.apk
            app/build/outputs/apk/release/wgserve-universal.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: wgserve v1.2.0
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/wgserve-armv7.apk
            app/build/outputs/apk/release/wgserve-arm64.apk
            app/build/outputs/apk/release/wgserve-universal.apk
