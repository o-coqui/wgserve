name: Build ARMv7 APK

on:
  push:
    branches:
      - armv7-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-32" "build-tools;32.0.0" "ndk;25.2.9519653"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK ABI
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/.*\.so$'
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo 'ERROR: APK contains ARM64 libraries; this build must be ARMv7 only.'
            exit 1
          fi

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: wgserve-armv7-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
